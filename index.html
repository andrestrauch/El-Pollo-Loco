<!doctype html>
<html lang="de" translate="no">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>El Pollo Loco</title>

		<link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon" />

		<link rel="stylesheet" href="./styles/standard.css" />
		<link rel="stylesheet" href="./styles/standard.css" />
		<link rel="stylesheet" href="./styles/style.css" />

		<script type="module" src="./scripts/script.js"></script>
		<script type="module">
			import { init } from "./scripts/script.js";
			import { gameRestart } from "./scripts/script.js";
			import { setSoundBtn } from "./scripts/script.js";
			document.querySelector("#startBtn").addEventListener("click", init);
			document.querySelector("#restartBtn").addEventListener("click", gameRestart);
			document.querySelector("#restartBtn2").addEventListener("click", gameRestart);
			document.querySelector("#muteBtn").addEventListener("click", setSoundBtn);
		</script>
	</head>

	<body>
		<section id="fullscreen" class="gamescreen">
			<h1 id="title">El Pollo Loco</h1>
			<canvas id="canvas" width="1200" height="800"></canvas>
			<button id="startBtn" class="start-btn">Game start</button>

			<section class="mobil-section">
				<article class="mobil-btn">
					<button id="btnLeft">
						<img src="./assets/icons/arrow_left.png" alt="" />
					</button>
					<button id="btnRight">
						<img src="./assets/icons/arrow_right.png" alt="" />
					</button>
				</article>
				<article class="mobil-btn">
					<button id="btnUp">
						<img src="./assets/icons/arrow_up.png" alt="" />
					</button>
					<button id="btnThrow">
						<img src="./assets/icons/bottle.png" alt="" />
					</button>
				</article>
			</section>

			<section id="gameOver" class="game-over">
				<img src="./assets/img/You won, you lost/Game over A.png" alt="" />
				<button id="restartBtn" class="restart-btn">Restart</button>
			</section>

			<section id="gameEnd" class="game-end">
				<img src="./assets/img/You won, you lost/You Won B.png" alt="" />
				<button id="restartBtn2" class="restart-btn">Restart</button>
			</section>

			<section class="sound-mute">
				<button id="muteBtn" class="mute-btn">
					<img src="./assets/icons/muted_btn.png" alt="" />
				</button>
			</section>
		</section>
	</body>
</html>
